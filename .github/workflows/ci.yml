name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Sæt Python op
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installér afhængigheder
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kør tests
        run: |
          pytest test_app.py -v

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Deploy til Render
        run: echo "Tests passed - Render deployer automatisk via GitHub push"